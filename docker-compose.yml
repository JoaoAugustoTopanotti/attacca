# Banco de DESENVOLVIMENTO local (Postgres em Docker).
# Isola o dev do banco de produção (Neon): mexer aqui nunca toca a produção.
#
# Uso:
#   docker compose up -d      # liga o banco (fica rodando em segundo plano)
#   docker compose down       # desliga (os dados ficam guardados no volume)
#   docker compose down -v     # desliga E APAGA os dados (recomeçar do zero)
#
# A string de conexão correspondente (vai no .env):
#   DATABASE_URL="postgresql://attacca:attacca@localhost:55432/attacca_dev"

# `name` fixa o projeto compose, que por padrão vem do NOME DA PASTA — sem isso,
# renomear a pasta criaria um volume novo e vazio e o banco de dev leria zerado.
name: attacca

services:
  db:
    image: postgres:16
    container_name: attacca-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attacca
      POSTGRES_PASSWORD: attacca
      POSTGRES_DB: attacca_dev
    ports:
      # host:container — 55432 no host pra não colidir com os Postgres nativos
      # do Windows (16 e 17) que já ocupam 5432/5433 nesta máquina.
      - "55432:5432"
    volumes:
      # o compose prefixa com o nome do projeto → volume real: attacca_pgdata
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attacca -d attacca_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
